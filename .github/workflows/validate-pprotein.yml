name: Validate pprotein image

on:
  pull_request:
    paths:
      - 'pprotein/**'
      - '.github/workflows/validate-pprotein.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image without pushing
        uses: docker/build-push-action@v6
        with:
          context: ./pprotein
          file: ./pprotein/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
