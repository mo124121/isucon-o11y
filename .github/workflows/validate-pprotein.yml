name: Validate pprotein image

on:
  push:
    paths:
      - 'pprotein/**'
      - '.github/workflows/validate-pprotein.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build image without pushing
        uses: docker/build-push-action@v7
        with:
          context: ./pprotein
          file: ./pprotein/Dockerfile
          push: false
          load: true
          tags: pprotein:validate

      - name: Start container and check HTTP endpoint
        shell: bash
        run: |
          set -euo pipefail

          container=pprotein-smoke
          trap 'docker logs "${container}" 2>&1 || true; docker rm -f "${container}" >/dev/null 2>&1 || true' EXIT

          docker run --detach \
            --name "${container}" \
            --publish 9000:9000 \
            pprotein:validate

          for _ in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:9000/api/pprof >/dev/null; then
              exit 0
            fi
            sleep 1
          done

          echo "pprotein did not become ready" >&2
          exit 1
